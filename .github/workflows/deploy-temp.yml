name: Deploy to Temp Server

on:
  push:
    branches: [temp]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEMP_SERVER_TAILSCALE_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 20m
          script: |
            set -e

            APP_DIR="/var/www/leaftrack-temp"

            # Clone on first deploy, pull on subsequent deploys
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch temp https://github.com/KD-3030/LeafTrack.git "$APP_DIR"
              cd "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin temp
              git reset --hard origin/temp
            fi

            # Ensure NVM is loaded
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Install all dependencies (devDeps needed for next build)
            npm ci

            # Build
            npm run build

            # Standalone mode: copy static assets into the standalone output
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public

            # Reload PM2 (zero-downtime), start if not running yet
            if pm2 describe leaftrack-temp > /dev/null 2>&1; then
              pm2 reload leaftrack-temp --update-env
            else
              PORT=3002 pm2 start .next/standalone/server.js --name leaftrack-temp
              pm2 save
            fi

            echo "Temp deploy complete."
